name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Множитель длительностей тестов в реальном времени (gateway): запас для медленного
  # раннера, соотношения таймаутов не меняются.
  ZA_TEST_TIME_SCALE: "4"

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # v7 (последняя на 2026-11-09) работает на Node 24; v4 — на устаревшем Node 20.
      - uses: actions/checkout@v7
      # С rustup 1.28 `rustup show` больше не ставит тулчейн; без аргументов
      # `rustup toolchain install` читает канал и компоненты из rust-toolchain.toml.
      - name: Тулчейн Rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # cargo-deny ставится бинарником: EmbarkStudios/cargo-deny-action это
      # Docker-действие и на windows-latest не запускается.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # Чистые части `za-llm` без функций — так его подключает `za-core`.
      - run: cargo test -p za-llm --no-default-features --locked
      # Ядро отдельно: при --workspace функции объединяются, и za-core видел бы za-llm
      # с gateway/http (ARC-011).
      - run: cargo check -p za-core --locked
      - run: cargo --locked xtask policy
      - run: cargo deny --locked check
