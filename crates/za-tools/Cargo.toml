[package]
name = "za-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "zero-agent: za-tools"

[lints]
workspace = true

# Нативные инструменты (R1-C1 D73, D74, D87): `read`, `search`, `glob`. Из крейтов
# workspace — только `za-protocol`, `za-core`, `za-jail` (проверяет `cargo xtask policy`).
[dependencies]
za-protocol = { path = "../za-protocol" }
za-core = { path = "../za-core" }
# Запуск команд `bash` — только через `za_jail::Runner` (SEC-006, D84, D85).
za-jail = { path = "../za-jail" }
# Хэш содержимого у трекера чтений (раздел 4.1 ТЗ 02, D87).
blake3.workspace = true
globset.workspace = true
grep-matcher.workspace = true
grep-regex.workspace = true
grep-searcher.workspace = true
ignore.workspace = true
serde.workspace = true
serde_json.workspace = true
# Унифицированный diff результата и сходство участков у `edit` (D88).
similar.workspace = true
# Ошибки восстановления чекпоинта (`RestoreError`).
thiserror.workspace = true
# `rt` — `spawn_blocking`: вся работа с ФС идёт вне потоков tokio; `time` — предел
# чекпоинта, `sync` — чекпоинты одного процесса по одному (D89).
tokio = { workspace = true, features = ["rt", "time", "sync"] }
tracing.workspace = true

# Только Unix: `geteuid` — владелец файла правки и каталога маркеров (I2, m11 задачи 7).
[target.'cfg(unix)'.dependencies]
nix.workspace = true

[features]
# Тестовая подмена часов проверки секретов (`GitCheckpointer::with_secret_clock_for_tests`)
# — только с этим признаком, не под `debug_assertions` (D128): обычная и release-сборка её
# не содержат. Тест с ней — `content_scan_cached_by_stat_and_fingerprint` в
# `tests/checkpoint.rs`; в CI — шаг `cargo test -p za-tools --features test-hooks`.
test-hooks = []

[dev-dependencies]
# Golden описаний нативных инструментов — тот же канонический JSON, что в префиксе
# запроса (`za_llm::render_tools`, D97); без функций по умолчанию.
za-llm = { path = "../za-llm", default-features = false }
# `test-util` — тест предела чекпоинта на остановленных часах (`start_paused`).
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "test-util"] }
