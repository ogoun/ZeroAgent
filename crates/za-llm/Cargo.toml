[package]
name = "za-llm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "zero-agent: za-llm"

[lints]
workspace = true

[dependencies]
za-protocol = { path = "../za-protocol" }
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true
thiserror.workspace = true
tracing.workspace = true
# Канал стрима, задача стрима и её отмена (D2), время повторов и очереди.
tokio = { workspace = true, features = ["sync", "rt", "time"] }
reqwest = { workspace = true, optional = true }
# Даты `Retry-After` (HTTP-дата RFC 9110) и сброса лимитов Anthropic (RFC 3339).
jiff = { workspace = true, optional = true }

[features]
# Без функций крейт даёт только чистые части: канонический формат, возможности,
# ошибки, `ModelPort`, `ScriptedModel`, префикс. Так его подключает `za-core`.
# `http` — транспорт, коннекторы и зонды; `gateway` — очередь, повторы и `Gateway`.
default = ["gateway"]
gateway = ["http"]
# `tokio/macros` — `select!` насоса SSE коннекторов на `tx.closed()` (D2).
http = ["dep:reqwest", "dep:jiff", "tokio/macros"]
# Псевдоним R0 для совместимости.
probe = ["http"]

[[test]]
name = "probe"
required-features = ["http"]

[[test]]
name = "sse"
required-features = ["http"]

[[test]]
name = "chat_wire"
required-features = ["http"]

[[test]]
name = "anthropic_wire"
required-features = ["http"]

[[test]]
name = "responses_wire"
required-features = ["http"]

[[test]]
name = "profiles"
required-features = ["http"]

[dev-dependencies]
axum.workspace = true
http-body.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time"] }
