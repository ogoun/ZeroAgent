[package]
name = "za-llm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "zero-agent: za-llm"

[lints]
workspace = true

[dependencies]
za-protocol = { path = "../za-protocol" }
serde_json.workspace = true
blake3.workspace = true
# Нужны только зонду llama.cpp (`probe`).
tracing = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }

[features]
# Без `probe` крейт — только рендер префикса и его хэш, без HTTP-клиента:
# так его подключает `za-core`.
default = ["probe"]
probe = ["dep:reqwest", "dep:thiserror", "dep:tracing"]

[[test]]
name = "probe"
required-features = ["probe"]

[dev-dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }
