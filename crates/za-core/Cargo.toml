[package]
name = "za-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "zero-agent: za-core"

[lints]
workspace = true

[dependencies]
za-protocol = { path = "../za-protocol" }
za-store = { path = "../za-store" }
# Только префикс и его хэш: без зонда и HTTP-клиента.
za-llm = { path = "../za-llm", default-features = false }
blake3.workspace = true
# `ToolOutput` сериализуется в квитанцию эффекта вызова инструмента.
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# `sync`: `broadcast` шины событий run (`EventBus`, D35).
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
