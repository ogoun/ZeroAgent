[package]
name = "za-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "zero-agent: za-core"

[lints]
workspace = true

[dependencies]
za-protocol = { path = "../za-protocol" }
za-store = { path = "../za-store" }
# Только префикс и его хэш: без зонда и HTTP-клиента.
za-llm = { path = "../za-llm", default-features = false }
blake3.workspace = true
# `ToolOutput` сериализуется в квитанцию эффекта вызова инструмента.
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# `sync`: `broadcast` шины событий run (`EventBus`, D35).
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
# Сверка открытого дескриптора с каноническим путём (D98).
same-file.workspace = true

[target.'cfg(windows)'.dependencies]
# Число жёстких ссылок у `paths::open_checked` (I3).
winapi-util.workspace = true
# Локальные тома: сетевой диск и `subst` отвергаются по типу диска до обращения к ним
# (Ruling C1). Крейт уже в дереве у `za-res`.
sysinfo.workspace = true

[target.'cfg(unix)'.dependencies]
# `O_NOFOLLOW` у `paths::open_checked` (D98).
libc.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
