[package]
name = "za-res"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "zero-agent: za-res"

[lints]
workspace = true

[dependencies]
# Из крейтов za-* — только протокол (D1, проверяется `cargo xtask policy`).
za-protocol = { path = "../za-protocol" }
serde.workspace = true
jiff.workspace = true
sysinfo.workspace = true
tracing.workspace = true
thiserror.workspace = true
# Таймеры опроса, `spawn_blocking`, процесс `nvidia-smi` с таймаутом и `kill_on_drop`, канал снимков.
tokio = { workspace = true, features = ["sync", "time", "rt", "process", "macros"] }

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "process", "macros", "rt-multi-thread", "test-util"] }
