[package]
name = "za-res"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "zero-agent: za-res"

[lints]
workspace = true

[dependencies]
# Из крейтов za-* — только протокол (D1) и запуск процессов `za-jail` (R1-C1 D73:
# `nvidia-smi` через `Runner`); проверяется `cargo xtask policy`.
za-protocol = { path = "../za-protocol" }
za-jail = { path = "../za-jail" }
serde.workspace = true
jiff.workspace = true
sysinfo.workspace = true
tracing.workspace = true
thiserror.workspace = true
# Таймеры опроса, `spawn_blocking`, канал снимков; процесс `nvidia-smi` — через `za-jail`.
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "macros", "rt-multi-thread", "test-util"] }
