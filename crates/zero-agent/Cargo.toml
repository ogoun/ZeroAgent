[package]
name = "zero-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "zero-agent: агент"

[lints]
workspace = true

[dependencies]
za-protocol = { path = "../za-protocol" }
za-store = { path = "../za-store" }
za-core = { path = "../za-core" }
za-llm = { path = "../za-llm" }
za-res = { path = "../za-res" }
clap.workspace = true
# `macros` — `join!` проверок doctor, `time` — ожидание зондов и `resources --watch`.
tokio = { workspace = true, features = ["rt", "macros", "time"] }
toml.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
blake3.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# Поддельный llama-server в процессе теста `r1a_models` (axum на многопоточном runtime).
tokio = { workspace = true, features = ["rt", "macros", "rt-multi-thread", "net", "time"] }
axum.workspace = true
