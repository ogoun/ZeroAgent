[package]
name = "zero-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "zero-agent: агент"

[lints]
workspace = true

[dependencies]
za-protocol = { path = "../za-protocol" }
za-store = { path = "../za-store" }
za-core = { path = "../za-core" }
za-llm = { path = "../za-llm" }
za-res = { path = "../za-res" }
# Цикл агента: команды `run` и `answer` (R1-B1).
za-agent = { path = "../za-agent" }
# Чекпоинты рабочей копии: `checkpoints list|restore` (R1-C1 D89), git — через `za-jail`.
za-tools = { path = "../za-tools" }
za-jail = { path = "../za-jail" }
# Секреты (R1-C1 D90): `EnvStore` (`ZA_SECRET_*`) под кэшем `StoreSecrets`, маскировка
# выгрузки журнала, аудита и печати `run`; команда `secret list`.
za-secrets = { path = "../za-secrets" }
clap.workspace = true
# `macros` — `join!` проверок doctor и `select!` команды `run`, `time` — ожидание зондов и
# `resources --watch`, `signal` — Ctrl+C команды `run` (пауза, второй — выход).
tokio = { workspace = true, features = ["rt", "macros", "time", "signal"] }
toml.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
blake3.workspace = true
# Поиск известных значений фильтром секретов чекпоинтов (D103).
memchr.workspace = true
# Дата `<env>` первого сообщения run (`YYYY-MM-DD` по UTC, D24).
jiff.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# Поддельный llama-server в процессе теста `r1a_models` (axum на многопоточном runtime).
tokio = { workspace = true, features = ["rt", "macros", "rt-multi-thread", "net", "time"] }
axum.workspace = true
# Тело ответа с обрывом посреди стрима (`Frame`) в тесте повтора `ask`.
http-body.workspace = true
# Подделка записи аудита мимо хранилища в тесте `audit --verify` (R1-C1, задача 4).
rusqlite.workspace = true
