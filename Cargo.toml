[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
rust-version = "1.92"

[workspace.lints.rust]
unsafe_code = "forbid"

# Общие версии зависимостей; крейты подключают через `dep.workspace = true`.
# Только crates.io (проверяется `cargo xtask policy` и `cargo deny`).
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip: дробные числа читаются из журнала без потери точности, иначе
# сверка аргументов эффекта при повторе давала бы ложное расхождение.
# raw_value: тело запроса Anthropic уходит готовым текстом, чтобы входы `tool_use`
# возвращались провайдеру байт-в-байт (preserved thinking); новых крейтов нет.
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
uuid = { version = "1", default-features = false, features = ["std", "v7", "serde"] }
jiff = { version = "0.2", default-features = false, features = ["serde", "std"] }
# SQLite со встроенной сборкой: версия библиотеки фиксирована крейтом (ARC-031, ≥ 3.51.3).
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled"] }
# API хранилища асинхронный; писатель и читатели — обычные потоки, нужен только `sync`.
# Бинарник `zero-agent` включает ещё `signal`: Ctrl+C команды `run` ставит run на паузу
# (R1-B1 D26); это функция того же крейта, новых крейтов нет.
tokio = { version = "1.54.1", default-features = false }
thiserror = "2.0.21"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
# Подписчик логов только в бинарнике: текст в stderr, фильтр из ZA_LOG/RUST_LOG
# через `filter::Targets` (без regex и env-filter), без ANSI-цветов.
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "registry"] }
# Адресация blobs по содержимому (ARC-032).
blake3 = "1.8.7"
# HTTP-клиент к llama-server: без native TLS и OpenSSL, только rustls (ring).
# Встроенные корни (webpki-roots), не хранилище ОС: одинаковое поведение на Windows и Linux.
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
# Только тип `rustls::Error` — распознать ошибку TLS в цепочке причин reqwest (сертификат,
# рукопожатие) и не повторять её. Версия — та же, что у reqwest; новых крейтов нет.
rustls = { version = "0.23.46", default-features = false, features = ["std"] }
# Только для поддельного HTTP-сервера в тестах.
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
# Тело ответа поддельного сервера в тестах (`Frame`): SSE с задержками, обрывом и счётчиком
# отключений клиента. Крейт уже в дереве через axum и reqwest, новых крейтов нет.
http-body = "1.1.0"
# Разбор `ZA_HOME/config.toml` (D23): разделы `[models]` и `[resources]` в бинарнике
# `zero-agent`; dev-зависимость `za-llm` — тест ошибок разбора без фрагментов исходника
# (`ConfigParseError`). Без `display`/`preserve_order`: только разбор и serde.
toml = { version = "1.1.8", default-features = false, features = ["std", "serde", "parse"] }
# Разбор командной строки бинарника zero-agent.
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
# Монитор ресурсов `za-res` (D7): CPU, RAM и тома без `unsafe` в нашем коде на Windows и Linux
# (своя реализация через WinAPI потребовала бы `unsafe`). Только `system` и `disk`, без
# сети, компонентов и пользователей. Лицензия MIT.
sysinfo = { version = "0.40", default-features = false, features = ["system", "disk"] }
# Счёт токенов фиксированных промптов в CI (`cargo xtask prompt-budget`, PRM-007, D64):
# словари cl100k и o200k встроены в крейт, сеть не нужна; `tokenizers` от HF тянет
# десятки крейтов. Только у `xtask` (проверяется `cargo xtask policy`).
tiktoken-rs = { version = "=0.12.1", default-features = false }
# Сверка открытого файла с путём (R1-C1 D98, `za_core::paths::open_checked`): тот же ли
# это файл, без `unsafe` в нашем коде (на Windows — `GetFileInformationByHandle` через
# `winapi-util`). Лицензия Unlicense OR MIT. Позже его же тянет `ignore` у `za-tools`.
same-file = "=1.0.6"
# Только константа `O_NOFOLLOW` на Unix (D98): крейт уже в Cargo.lock, новых крейтов нет.
# План называл `nix`; его нет ни в Cargo.lock, ни в локальном реестре, а для одной
# константы хватает `libc`, через который `nix` и работает.
libc = { version = "=0.2.191", default-features = false }
# Число жёстких ссылок открытого файла на Windows (R1-C1 I3, `open_checked`): API
# `file::information` без `unsafe` в нашем коде. Крейт уже в Cargo.lock через `same-file`.
winapi-util = "=0.1.11"
# Запуск дочерних процессов деревом (R1-C1 D73, D84, ADR 0005): Job Object с
# `KILL_ON_JOB_CLOSE` на Windows и группа процессов на Unix, без `unsafe` в нашем коде.
# Версия — та, что в локальном реестре cargo. Функции: `tokio1` (асинхронный API),
# `job-object`, `process-group`, `kill-on-drop` (без неё Job Object не получает
# `KILL_ON_JOB_CLOSE`), `creation-flags` (`CREATE_NO_WINDOW`, как раньше у `nvidia-smi`;
# без неё `JobObject` перезаписывает флаги создания). Лицензия MIT OR Apache-2.0.
process-wrap = { version = "=10.0.1", default-features = false, features = ["tokio1", "job-object", "process-group", "kill-on-drop", "creation-flags"] }
# Только Unix (`za-jail`): `killpg`, `kill`, `waitpid` и `PR_SET_CHILD_SUBREAPER` без
# `unsafe` — убить дерево при броске future и остатки после смерти агента (D84);
# `fs` — `O_NOFOLLOW` при чтении реестра групп, `user` — `geteuid` для проверки владельца
# реестра. Версия — та, что в локальном реестре
# cargo; крейт и так приходит через `process-wrap` (у него те же `fs` и `signal`).
# Лицензия MIT.
nix = { version = "=0.31.3", default-features = false, features = ["signal", "process", "fs", "user"] }
# Только Windows (`za-jail`): тип флагов создания процесса для `CreationFlags`
# (`CREATE_NO_WINDOW`). Крейт уже в дереве через `process-wrap` и `sysinfo`, новых крейтов нет.
windows = { version = "=0.62.2", features = ["Win32_System_Threading"] }
# Обход дерева у `search` и `glob` (`za-tools`, R1-C1 D73, D87): `.gitignore`, `.ignore` и
# `.git/info/exclude` без git в `PATH`, без чтения родительских каталогов, без перехода по
# ссылкам. Последняя 0.4.x, вышедшая не меньше двух недель назад (2026-10-27); лицензия
# Unlicense OR MIT. Требует `globset ^0.4.18`, поэтому версия `globset` ниже общая.
ignore = "=0.4.34"
# Шаблоны `glob` и фильтр `search` (D73, D87); та же версия пойдёт правилам политики `za-agent`
# (D80, Ruling 6/globset). Лицензия Unlicense OR MIT.
globset = "=0.4.20"
# Построчный поиск `search` (D73, D87): двоичные файлы пропускаются по NUL, BOM UTF-16
# распознаётся. Последняя 0.1.x старше двух недель (2026-07-15); лицензия Unlicense OR MIT,
# транзитивный `encoding_rs` — (Apache-2.0 OR MIT) AND BSD-3-Clause (разрешена в `deny.toml`).
grep-searcher = "=0.1.17"
# Регулярные выражения `search` поверх `regex-automata` (уже в Cargo.lock). Последняя 0.1.x
# (2025-10-16); лицензия Unlicense OR MIT.
grep-regex = "=0.1.14"
# Только тип `LineTerminator`: CRLF у поиска и выражения `search` должен совпадать (`$` перед
# `\r\n` в файлах Windows). Крейт и так приходит через `grep-searcher`, новых крейтов не добавляет.
grep-matcher = "=0.1.9"
# Унифицированный diff результата `edit` и сходство участков в подсказке «closest region»
# (`za-tools`, R1-C1 D73, D88, Ruling 6/similar). Версия — та, что в локальном реестре
# cargo; только функция `text`, без `unicode`, `bytes` и `inline`. Зависимостей нет;
# лицензия Apache-2.0.
similar = { version = "=2.7.0", default-features = false, features = ["text"] }
# Нормализация хоста (R1-C2 D124, `za_core::net::normalize_host`): `Host::parse` по WHATWG —
# IDNA в punycode, IPv4 в любой записи (`0x7f.1`), канонический IPv6. Позже — разбор URL
# шлюза `za-web`. Крейт уже в Cargo.lock через `reqwest`, новых крейтов нет; только `std`.
# Лицензия MIT OR Apache-2.0.
url = { version = "=2.5.8", default-features = false, features = ["std"] }
