[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
tiktoken-rs.workspace = true
za-agent = { path = "../crates/za-agent" }
za-protocol = { path = "../crates/za-protocol" }
# Случаи бюджета промптов с настоящими нативными инструментами (R1-C1 D93, D99):
# `za_tools::native_capability`, раннер — только для сборки инструментов, не вызывается.
za-tools = { path = "../crates/za-tools" }
za-core = { path = "../crates/za-core" }
za-jail = { path = "../crates/za-jail" }
# Случаи `top/standard/tools@{16k,32k}` (R1-C2 D117): описания `web_fetch` и `web_search`
# (шлюз и поставщик только строятся, сети нет) и каталог скиллов поставки.
za-web = { path = "../crates/za-web" }
za-skills = { path = "../crates/za-skills" }
url.workspace = true

