# Политика зависимостей: только crates.io, разрешённые лицензии, известные уязвимости блокируются.
[graph]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

[advisories]
yanked = "deny"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    # webpki-roots (встроенные корни TLS для reqwest/rustls): данные сертификатов Mozilla,
    # разрешительная лицензия без копилефта.
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
deny = [
    { name = "rig-core" },
    { name = "adk-rust" },
    { name = "autoagents" },
    # Счёт токенов промптов (R1-B2 D64) — только инструмент CI: в продукт не попадает
    # ни напрямую, ни транзитивно (полный граф; `cargo xtask policy` видит только
    # прямые зависимости).
    { name = "tiktoken-rs", wrappers = ["xtask"] },
    # Разбор команд оболочки (R1-C1 D99): продукт видит его только через `za_core::shell`.
    { name = "za-shell", wrappers = ["za-core"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
