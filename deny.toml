# Политика зависимостей: только crates.io, разрешённые лицензии, известные уязвимости блокируются.
[graph]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

[advisories]
yanked = "deny"
# RUSTSEC-2026-0192: `ttf-parser` не сопровождается (не уязвимость). Приходит только через
# `lopdf 0.42` (`pdf-extract 0.12.1` требует `^0.42`, R1-C2 задача 10), где вызывается лишь при
# создании документа со встроенным шрифтом (`lopdf::FontData::new`); разбор PDF в
# `za-extract` (подпроцесс `zero-agent extract pdf`) этот путь не вызывает. Снять, когда
# `pdf-extract` перейдёт на `lopdf` ≥ 0.45 (там `skrifa` вместо `ttf-parser`).
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser only via lopdf FontData::new (PDF creation), not on the za-extract parsing path" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    # webpki-roots (встроенные корни TLS для reqwest/rustls): данные сертификатов Mozilla,
    # разрешительная лицензия без копилефта.
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
deny = [
    { name = "rig-core" },
    { name = "adk-rust" },
    { name = "autoagents" },
    # Счёт токенов промптов (R1-B2 D64) — только инструмент CI: в продукт не попадает
    # ни напрямую, ни транзитивно (полный граф; `cargo xtask policy` видит только
    # прямые зависимости).
    { name = "tiktoken-rs", wrappers = ["xtask"] },
    # Разбор команд оболочки (R1-C1 D99): продукт видит его только через `za_core::shell`.
    { name = "za-shell", wrappers = ["za-core"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
